<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 396" width="940" height="396" role="img" aria-label="System architecture"><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace"><text x="20" y="26" font-size="10.5" letter-spacing="2.8" fill="#7b8891">OFFLINE</text><text x="672" y="26" font-size="10.5" letter-spacing="2.8" fill="#7b8891">IN MATCH</text><line x1="20" y1="36" x2="920" y2="36" stroke="#2b343a" stroke-width="1" stroke-dasharray="2 4"/><rect x="20" y="56" width="268" height="92" rx="2" fill="#12171a" stroke="#2b343a" stroke-width="1"/><text x="36" y="86" font-size="13" font-weight="700" letter-spacing="1.6" fill="#dae1e6">C++ TRAINER</text><text x="36" y="108" font-size="11.5" letter-spacing="0.4" fill="#7b8891">external-sampling MCCFR</text><text x="36" y="125" font-size="11.5" letter-spacing="0.4" fill="#7b8891">hours, many cores</text><line x1="288" y1="102" x2="329" y2="102" stroke="#2b343a" stroke-width="1"/><path d="M336 102 L329 98.5 L329 105.5 Z" fill="#2b343a"/><rect x="336" y="56" width="268" height="92" rx="2" fill="#12171a" stroke="#2b343a" stroke-width="1"/><text x="352" y="86" font-size="13" font-weight="700" letter-spacing="1.6" fill="#dae1e6">STRATEGY TABLE</text><text x="352" y="108" font-size="11.5" letter-spacing="0.4" fill="#7b8891">one entry per abstracted</text><text x="352" y="125" font-size="11.5" letter-spacing="0.4" fill="#7b8891">decision</text><line x1="604" y1="102" x2="645" y2="102" stroke="#2b343a" stroke-width="1"/><path d="M652 102 L645 98.5 L645 105.5 Z" fill="#2b343a"/><rect x="652" y="56" width="268" height="92" rx="2" fill="#12171a" stroke="#e0a458" stroke-width="1"/><text x="668" y="86" font-size="13" font-weight="700" letter-spacing="1.6" fill="#dae1e6">MATCH PLAY</text><text x="668" y="108" font-size="11.5" letter-spacing="0.4" fill="#7b8891">table lookup, no search</text><text x="668" y="125" font-size="11.5" letter-spacing="0.4" fill="#7b8891">30 s for 1000 hands</text><line x1="154" y1="148" x2="154" y2="196" stroke="#2b343a" stroke-width="1" stroke-dasharray="3 3"/><line x1="786" y1="148" x2="786" y2="196" stroke="#2b343a" stroke-width="1" stroke-dasharray="3 3"/><rect x="20" y="196" width="900" height="68" rx="2" fill="#12171a" stroke="#2b343a" stroke-width="1"/><text x="36" y="226" font-size="13" font-weight="700" letter-spacing="1.6" fill="#dae1e6">SHARED ABSTRACTION</text><text x="36" y="248" font-size="11.5" letter-spacing="0.4" fill="#7b8891">the same key-construction functions are compiled into the trainer and imported by the bot</text><text x="20" y="300" font-size="10.5" letter-spacing="2.8" fill="#7b8891">EVALUATION</text><line x1="20" y1="310" x2="920" y2="310" stroke="#2b343a" stroke-width="1" stroke-dasharray="2 4"/><rect x="20" y="326" width="216" height="54" rx="2" fill="#0f1417" stroke="#2b343a" stroke-width="1"/><text x="34" y="349" font-size="11" font-weight="700" letter-spacing="1.1" fill="#dae1e6">LOCAL BEST RESPONSE</text><text x="34" y="367" font-size="10.5" fill="#7b8891">worst-case bound</text><rect x="248" y="326" width="216" height="54" rx="2" fill="#0f1417" stroke="#2b343a" stroke-width="1"/><text x="262" y="349" font-size="11" font-weight="700" letter-spacing="1.1" fill="#dae1e6">OPPONENT ZOO</text><text x="262" y="367" font-size="10.5" fill="#7b8891">match-win probability</text><rect x="476" y="326" width="216" height="54" rx="2" fill="#0f1417" stroke="#2b343a" stroke-width="1"/><text x="490" y="349" font-size="11" font-weight="700" letter-spacing="1.1" fill="#dae1e6">EXTERNAL BOTS</text><text x="490" y="367" font-size="10.5" fill="#7b8891">independent check</text><rect x="704" y="326" width="216" height="54" rx="2" fill="#0f1417" stroke="#2b343a" stroke-width="1"/><text x="718" y="349" font-size="11" font-weight="700" letter-spacing="1.1" fill="#dae1e6">KEY ORACLE</text><text x="718" y="367" font-size="10.5" fill="#7b8891">cross-language identity</text></g></svg>
