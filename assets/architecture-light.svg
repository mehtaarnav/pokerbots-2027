<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 396" width="940" height="396" role="img" aria-label="System architecture"><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace"><text x="20" y="26" font-size="10.5" letter-spacing="2.8" fill="#5c6a73">OFFLINE</text><text x="672" y="26" font-size="10.5" letter-spacing="2.8" fill="#5c6a73">IN MATCH</text><line x1="20" y1="36" x2="920" y2="36" stroke="#c9d1d6" stroke-width="1" stroke-dasharray="2 4"/><rect x="20" y="56" width="268" height="92" rx="2" fill="#ffffff" stroke="#d3dade" stroke-width="1"/><text x="36" y="86" font-size="13" font-weight="700" letter-spacing="1.6" fill="#12171b">C++ TRAINER</text><text x="36" y="108" font-size="11.5" letter-spacing="0.4" fill="#5c6a73">external-sampling MCCFR</text><text x="36" y="125" font-size="11.5" letter-spacing="0.4" fill="#5c6a73">hours, many cores</text><line x1="288" y1="102" x2="329" y2="102" stroke="#c9d1d6" stroke-width="1"/><path d="M336 102 L329 98.5 L329 105.5 Z" fill="#c9d1d6"/><rect x="336" y="56" width="268" height="92" rx="2" fill="#ffffff" stroke="#d3dade" stroke-width="1"/><text x="352" y="86" font-size="13" font-weight="700" letter-spacing="1.6" fill="#12171b">STRATEGY TABLE</text><text x="352" y="108" font-size="11.5" letter-spacing="0.4" fill="#5c6a73">one entry per abstracted</text><text x="352" y="125" font-size="11.5" letter-spacing="0.4" fill="#5c6a73">decision</text><line x1="604" y1="102" x2="645" y2="102" stroke="#c9d1d6" stroke-width="1"/><path d="M652 102 L645 98.5 L645 105.5 Z" fill="#c9d1d6"/><rect x="652" y="56" width="268" height="92" rx="2" fill="#ffffff" stroke="#b4761f" stroke-width="1"/><text x="668" y="86" font-size="13" font-weight="700" letter-spacing="1.6" fill="#12171b">MATCH PLAY</text><text x="668" y="108" font-size="11.5" letter-spacing="0.4" fill="#5c6a73">table lookup, no search</text><text x="668" y="125" font-size="11.5" letter-spacing="0.4" fill="#5c6a73">30 s for 1000 hands</text><line x1="154" y1="148" x2="154" y2="196" stroke="#c9d1d6" stroke-width="1" stroke-dasharray="3 3"/><line x1="786" y1="148" x2="786" y2="196" stroke="#c9d1d6" stroke-width="1" stroke-dasharray="3 3"/><rect x="20" y="196" width="900" height="68" rx="2" fill="#ffffff" stroke="#d3dade" stroke-width="1"/><text x="36" y="226" font-size="13" font-weight="700" letter-spacing="1.6" fill="#12171b">SHARED ABSTRACTION</text><text x="36" y="248" font-size="11.5" letter-spacing="0.4" fill="#5c6a73">the same key-construction functions are compiled into the trainer and imported by the bot</text><text x="20" y="300" font-size="10.5" letter-spacing="2.8" fill="#5c6a73">EVALUATION</text><line x1="20" y1="310" x2="920" y2="310" stroke="#c9d1d6" stroke-width="1" stroke-dasharray="2 4"/><rect x="20" y="326" width="216" height="54" rx="2" fill="#f2f5f6" stroke="#d3dade" stroke-width="1"/><text x="34" y="349" font-size="11" font-weight="700" letter-spacing="1.1" fill="#12171b">LOCAL BEST RESPONSE</text><text x="34" y="367" font-size="10.5" fill="#5c6a73">worst-case bound</text><rect x="248" y="326" width="216" height="54" rx="2" fill="#f2f5f6" stroke="#d3dade" stroke-width="1"/><text x="262" y="349" font-size="11" font-weight="700" letter-spacing="1.1" fill="#12171b">OPPONENT ZOO</text><text x="262" y="367" font-size="10.5" fill="#5c6a73">match-win probability</text><rect x="476" y="326" width="216" height="54" rx="2" fill="#f2f5f6" stroke="#d3dade" stroke-width="1"/><text x="490" y="349" font-size="11" font-weight="700" letter-spacing="1.1" fill="#12171b">EXTERNAL BOTS</text><text x="490" y="367" font-size="10.5" fill="#5c6a73">independent check</text><rect x="704" y="326" width="216" height="54" rx="2" fill="#f2f5f6" stroke="#d3dade" stroke-width="1"/><text x="718" y="349" font-size="11" font-weight="700" letter-spacing="1.1" fill="#12171b">KEY ORACLE</text><text x="718" y="367" font-size="10.5" fill="#5c6a73">cross-language identity</text></g></svg>
