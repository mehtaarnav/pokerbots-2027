<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hand replayer</title>
<style>
  :root {
    --bg: #0b0d0f;
    --panel: #111417;
    --panel-2: #15191d;
    --line: #222a30;
    --text: #d7dde2;
    --dim: #69757e;
    --dimmer: #414c54;
    --accent: #e0a458;
    --red: #cf4f5f;
    --win: #6f9e63;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }

  /* faint grid, so the surface reads as an instrument face rather than a slab */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: .35;
    pointer-events: none;
    z-index: 0;
  }

  #app {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    height: 100%;
  }

  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(11, 13, 15, .9);
  }
  header h1 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .22em;
    text-transform: uppercase;
  }
  header .meta { color: var(--dim); letter-spacing: .04em; }
  header .spacer { margin-left: auto; }

  button, label.filebtn {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 5px 11px;
    cursor: pointer;
    letter-spacing: .06em;
  }
  button:hover, label.filebtn:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; border-color: var(--line); color: var(--text); }
  input[type=file] { display: none; }

  /* ---------- hand list ---------- */
  aside {
    border-right: 1px solid var(--line);
    overflow-y: auto;
    background: var(--panel);
  }
  .hand-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 14px;
    border-bottom: 1px solid rgba(34, 42, 48, .5);
    cursor: pointer;
  }
  .hand-row:hover { background: var(--panel-2); }
  .hand-row.active { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }
  .hand-row .n { color: var(--dim); }
  .hand-row .d.pos { color: var(--win); }
  .hand-row .d.neg { color: var(--red); }
  .hand-row .d.zero { color: var(--dimmer); }

  /* ---------- table ---------- */
  main {
    overflow-y: auto;
    padding: 22px 26px 30px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .seat {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    border: 1px solid var(--line);
    background: var(--panel);
  }
  .seat.acting { border-color: var(--accent); }
  .seat.folded { opacity: .4; }
  .seat .who { font-weight: 600; letter-spacing: .12em; }
  .seat .tag {
    color: var(--dim);
    font-size: 11px;
    letter-spacing: .1em;
    margin-left: 8px;
  }
  .seat .nums { text-align: right; color: var(--dim); font-size: 12px; }
  .seat .nums b { color: var(--text); font-weight: 600; }

  .cards { display: flex; gap: 5px; margin-top: 7px; }

  .card {
    width: 34px; height: 47px;
    border-radius: 3px;
    background: #edeae3;
    color: #16191c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.05;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 1px 0 rgba(0,0,0,.5);
  }
  .card .s { font-size: 12px; }
  .card.red { color: var(--red); }
  .card.back {
    background: repeating-linear-gradient(45deg, #1b2126 0 4px, #141a1e 4px 8px);
    border: 1px solid var(--line);
  }
  .board .card { width: 40px; height: 55px; font-size: 17px; }

  .middle {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 16px;
    border: 1px solid var(--line);
    background: var(--panel-2);
  }
  .board { display: flex; gap: 6px; min-height: 55px; align-items: center; }
  .board .placeholder {
    width: 40px; height: 55px;
    border: 1px dashed var(--dimmer);
    border-radius: 3px;
    opacity: .45;
  }
  .potbox { margin-left: auto; text-align: right; }
  .potbox .label { color: var(--dim); font-size: 11px; letter-spacing: .16em; }
  .potbox .val { font-size: 24px; font-weight: 600; letter-spacing: .02em; }
  .street {
    color: var(--accent);
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
  }

  /* ---------- transport ---------- */
  .transport {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border: 1px solid var(--line);
    background: var(--panel);
  }
  input[type=range] {
    flex: 1;
    accent-color: var(--accent);
    background: transparent;
  }
  .frame-label { color: var(--dim); min-width: 96px; }

  .log {
    border: 1px solid var(--line);
    background: var(--panel);
    max-height: 210px;
    overflow-y: auto;
  }
  .log div {
    padding: 4px 14px;
    color: var(--dimmer);
    border-bottom: 1px solid rgba(34,42,48,.4);
  }
  .log div.done { color: var(--text); }
  .log div.now { color: var(--accent); background: var(--panel-2); }
  .log div .amt { color: inherit; font-weight: 600; }

  .result {
    padding: 10px 16px;
    border: 1px solid var(--line);
    background: var(--panel-2);
  }
  .result .pos { color: var(--win); }
  .result .neg { color: var(--red); }

  .fault {
    padding: 10px 16px;
    border: 1px solid var(--red);
    color: var(--red);
  }

  .hint { color: var(--dimmer); font-size: 11px; letter-spacing: .05em; }

  #drop {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(11,13,15,.94);
    border: 2px dashed var(--accent);
    color: var(--accent);
    letter-spacing: .16em;
  }
  #drop.on { display: flex; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Hand replayer</h1>
    <span class="meta" id="source"></span>
    <span class="spacer"></span>
    <span class="hint">&larr;&rarr; action &nbsp; &uarr;&darr; hand</span>
    <label class="filebtn">open gamelog<input type="file" id="file" accept=".txt,.log" /></label>
    <button id="demo-btn">demo</button>
  </header>

  <aside id="hands"></aside>

  <main>
    <div id="seat-top"></div>
    <div class="middle">
      <div>
        <div class="street" id="street">preflop</div>
        <div class="board" id="board"></div>
      </div>
      <div class="potbox">
        <div class="label">POT</div>
        <div class="val" id="pot">0</div>

    <div id="seat-bottom"></div>

    <div class="transport">
      <button id="prev">&larr;</button>
      <button id="next">&rarr;</button>
      <input type="range" id="scrub" min="0" max="0" value="0" />
      <span class="frame-label" id="frame-label"></span>
    </div>

    <div id="result"></div>
    <div class="log" id="log"></div>
  </main>
</div>

<div id="drop">DROP GAMELOG</div>

<script>
'use strict';

// Starting stack and blinds are fixed by the engine's config.py. They are read
// from the log where the log states them (the blind posts) and otherwise take
// the standard values.
const STARTING_STACK = 400;

/* ------------------------------- parsing -------------------------------
   Every phrasing below comes from vendor/engine/engine.py. Bet amounts are
   CUMULATIVE per street: the engine logs 'raises to N' where N is the total
   that player has committed on the street, and 'bets N' for the same quantity
   when nobody has bet yet, so the two are handled identically.              */

const RE = {
  round:  /^Round #(\d+), (\S+) \((-?\d+)\), (\S+) \((-?\d+)\)$/,
  street: /^(Flop|Turn|River) \[([^\]]*)\]/,
  dealt:  /^(\S+) dealt \[([^\]]*)\]$/,
  blind:  /^(\S+) posts the blind of (\d+)$/,
  shows:  /^(\S+) shows \[([^\]]*)\]$/,
  award:  /^(\S+) awarded (-?\d+)$/,
  sized:  /^(\S+) (?:bets|raises to) (\d+)$/,
  simple: /^(\S+) (folds|calls|checks)$/,
  final:  /^Final, (\S+) \((-?\d+)\), (\S+) \((-?\d+)\)$/,
  // engine.py writes these when a bot misbehaves; a log carrying one is not a
  // clean poker result and the page says so instead of drawing it as normal
  fault:  /ran out of time|disconnected|attempted illegal|misformatted/,
};

const STREET_NAME = { Flop: 'flop', Turn: 'turn', River: 'river' };

function parseLog(text) {
  const hands = [];
  const faults = [];
  let hand = null, final = null;

  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;

    if (RE.fault.test(line)) { faults.push(line); continue; }

    let m = line.match(RE.final);
    if (m) { final = { [m[1]]: +m[2], [m[3]]: +m[4] }; continue; }

    m = line.match(RE.round);
    if (m) {
      hand = {
        round: +m[1],
        // the header lists the small blind first, which is how the button is known
        order: [m[2], m[4]],
        hole: {}, shown: {}, deltas: {},
        streets: [{ name: 'preflop', board: [], actions: [] }],
      };
      hands.push(hand);
      continue;
    }
    if (!hand) continue;

    m = line.match(RE.street);
    if (m) {
      hand.streets.push({
        name: STREET_NAME[m[1]],
        board: m[2].split(/\s+/).filter(Boolean),
        actions: [],
      });
      continue;
    }

    m = line.match(RE.dealt);
    if (m) { hand.hole[m[1]] = m[2].split(/\s+/).filter(Boolean); continue; }

    m = line.match(RE.blind);
    if (m) { hand.streets[0].actions.push({ who: m[1], what: 'blind', amount: +m[2] }); continue; }

    m = line.match(RE.shows);
    if (m) { hand.shown[m[1]] = m[2].split(/\s+/).filter(Boolean); continue; }

    m = line.match(RE.award);
    if (m) { hand.deltas[m[1]] = +m[2]; continue; }

    m = line.match(RE.sized);
    if (m) { hand.streets[hand.streets.length - 1].actions.push({ who: m[1], what: 'bet', amount: +m[2] }); continue; }

    m = line.match(RE.simple);
    if (m) {
      const what = { folds: 'fold', calls: 'call', checks: 'check' }[m[2]];
      hand.streets[hand.streets.length - 1].actions.push({ who: m[1], what });
    }
  }
  return { hands, faults, final };
}

/* ------------------------------- frames -------------------------------
   One frame per action: the full table state immediately after it. Chips are
   tracked as `committed` (settled on earlier streets) plus `pip` (in front of
   a player on the current street), which is how the engine itself models a
   betting round.                                                            */

function buildFrames(hand) {
  const [sb, bb] = hand.order;
  const committed = { [sb]: 0, [bb]: 0 };
  let pip = { [sb]: 0, [bb]: 0 };
  let folded = null;
  const frames = [];

  hand.streets.forEach((street, si) => {
    if (si > 0) {
      committed[sb] += pip[sb];
      committed[bb] += pip[bb];
      pip = { [sb]: 0, [bb]: 0 };
    }
    for (const act of street.actions) {
      const other = act.who === sb ? bb : sb;
      let text;
      if (act.what === 'blind') {
        pip[act.who] = act.amount;
        text = `posts ${act.amount}`;
      } else if (act.what === 'bet') {
        // cumulative: the log's number IS the new pip
        const delta = act.amount - pip[act.who];
        pip[act.who] = act.amount;
        text = `bets to ${act.amount} (+${delta})`;
      } else if (act.what === 'call') {
        const target = Math.max(pip[other], pip[act.who]);
        const delta = target - pip[act.who];
        pip[act.who] = target;
        text = `calls ${delta}`;
      } else if (act.what === 'check') {
        text = 'checks';
      } else {
        folded = act.who;
        text = 'folds';
      }

      frames.push({
        street: street.name,
        board: street.board,
        pot: committed[sb] + committed[bb] + pip[sb] + pip[bb],
        pip: { ...pip },
        stacks: {
          [sb]: STARTING_STACK - committed[sb] - pip[sb],
          [bb]: STARTING_STACK - committed[bb] - pip[bb],
        },
        actor: act.who,
        folded,
        text: `${act.who} ${text}`,
      });
    }
  });
  return frames;
}

/* ------------------------------- rendering ------------------------------- */

const SUIT = { s: '♠', h: '♥', d: '♦', c: '♣' };

function cardEl(code) {
  const el = document.createElement('div');
  el.className = 'card';
  if (!code) { el.classList.add('back'); return el; }
  const rank = code.slice(0, -1);
  const suit = code.slice(-1).toLowerCase();
  if (suit === 'h' || suit === 'd') el.classList.add('red');
  el.innerHTML = `<span>${rank}</span><span class="s">${SUIT[suit] || suit}</span>`;
  return el;
}

const state = { hands: [], faults: [], final: null, hi: 0, fi: 0, frames: [], title: '' };

const $ = (id) => document.getElementById(id);

function load(text, title) {
  const parsed = parseLog(text);
  if (!parsed.hands.length) {
    $('result').innerHTML = '<div class="fault">No hands found. Expected an engine gamelog.txt.</div>';
    return;
  }
  state.hands = parsed.hands;
  state.faults = parsed.faults;
  state.final = parsed.final;
  state.title = title;
  state.hi = 0;
  selectHand(0);
  renderHandList();
  $('source').textContent =
    `${title} · ${parsed.hands.length} hands` +
    (parsed.faults.length ? ` · ${parsed.faults.length} FAULTS` : '');
}

function renderHandList() {
  const box = $('hands');
  box.innerHTML = '';
  // Always report the SAME player down the column. The small blind alternates,
  // so keying off h.order[0] would flip the reference every hand and make the
  // column unreadable as a running result.
  const ref = state.hands[0].order[0];
  state.hands.forEach((h, i) => {
    const d = h.deltas[ref] ?? 0;
    const row = document.createElement('div');
    row.className = 'hand-row' + (i === state.hi ? ' active' : '');
    row.innerHTML =
      `<span class="n">#${h.round}</span>` +
      `<span class="d ${d > 0 ? 'pos' : d < 0 ? 'neg' : 'zero'}">` +
      `${ref} ${d > 0 ? '+' : ''}${d}</span>`;
    row.onclick = () => { selectHand(i); renderHandList(); };
    box.appendChild(row);
  });
  const active = box.querySelector('.hand-row.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function selectHand(i) {
  state.hi = i;
  state.frames = buildFrames(state.hands[i]);
  state.fi = state.frames.length - 1;
  $('scrub').max = String(Math.max(0, state.frames.length - 1));
  render();
}

function seatEl(name, hand, frame, isButton) {
  const el = document.createElement('div');
  el.className = 'seat';
  if (frame && frame.actor === name && frame.folded !== name) el.classList.add('acting');
  if (frame && frame.folded === name) el.classList.add('folded');

  const left = document.createElement('div');
  const label = document.createElement('div');
  label.innerHTML = `<span class="who">${name}</span>` +
    `<span class="tag">${isButton ? 'BUTTON / SB' : 'BB'}</span>`;
  left.appendChild(label);

  const cards = document.createElement('div');
  cards.className = 'cards';
  const hole = hand.hole[name] || hand.shown[name] || [];
  if (hole.length) hole.forEach((c) => cards.appendChild(cardEl(c)));
  else { cards.appendChild(cardEl(null)); cards.appendChild(cardEl(null)); }
  left.appendChild(cards);

  const right = document.createElement('div');
  right.className = 'nums';
  const stack = frame ? frame.stacks[name] : STARTING_STACK;
  const pip = frame ? frame.pip[name] : 0;
  right.innerHTML = `stack <b>${stack}</b><br />in front <b>${pip}</b>`;

  el.appendChild(left);
  el.appendChild(right);
  return el;
}

function render() {
  const hand = state.hands[state.hi];
  if (!hand) return;
  const frame = state.frames[state.fi] || null;
  const [sb, bb] = hand.order;

  $('seat-top').replaceChildren(seatEl(bb, hand, frame, false));
  $('seat-bottom').replaceChildren(seatEl(sb, hand, frame, true));

  $('street').textContent = frame ? frame.street : 'preflop';
  $('pot').textContent = frame ? frame.pot : 0;

  const board = $('board');
  board.replaceChildren();
  const cards = frame ? frame.board : [];
  for (let i = 0; i < 5; i++) {
    if (cards[i]) board.appendChild(cardEl(cards[i]));
    else {
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      board.appendChild(ph);
    }
  }

  $('scrub').value = String(state.fi);
  $('frame-label').textContent = `${state.fi + 1} / ${state.frames.length}`;
  $('prev').disabled = state.fi <= 0;
  $('next').disabled = state.fi >= state.frames.length - 1;

  const log = $('log');
  log.replaceChildren();
  state.frames.forEach((f, i) => {
    const d = document.createElement('div');
    d.className = i < state.fi ? 'done' : i === state.fi ? 'now' : '';
    d.textContent = `${f.street.padEnd(8)} ${f.text}`;
    d.onclick = () => { state.fi = i; render(); };
    log.appendChild(d);
  });
  const now = log.querySelector('.now');
  if (now) now.scrollIntoView({ block: 'nearest' });

  const res = $('result');
  const parts = [];
  if (state.faults.length) {
    parts.push(`<div class="fault">${state.faults.length} fault line(s) in this log: ` +
      `${state.faults.slice(0, 3).join('; ')}</div>`);
  }
  const ds = hand.order.map((p) => {
    const v = hand.deltas[p] ?? 0;
    return `<span class="${v > 0 ? 'pos' : v < 0 ? 'neg' : ''}">${p} ${v > 0 ? '+' : ''}${v}</span>`;
  }).join(' &nbsp; ');
  const shown = Object.keys(hand.shown).length ? 'showdown' : 'no showdown';
  parts.push(`<div class="result">${ds} &nbsp;&nbsp;<span class="hint">${shown}</span></div>`);
  res.innerHTML = parts.join('');
}

/* ------------------------------- controls ------------------------------- */

function step(n) {
  state.fi = Math.max(0, Math.min(state.frames.length - 1, state.fi + n));
  render();
}
function stepHand(n) {
  const i = Math.max(0, Math.min(state.hands.length - 1, state.hi + n));
  if (i !== state.hi) { selectHand(i); renderHandList(); }
}

$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('scrub').oninput = (e) => { state.fi = +e.target.value; render(); };

document.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft') { step(-1); e.preventDefault(); }
  else if (k === 'ArrowRight') { step(1); e.preventDefault(); }
  else if (k === 'ArrowUp') { stepHand(-1); e.preventDefault(); }
  else if (k === 'ArrowDown') { stepHand(1); e.preventDefault(); }
});

$('file').onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  f.text().then((t) => load(t, f.name));
};

$('demo-btn').onclick = () => load($('demo-log').textContent, 'synthetic demo');

const drop = $('drop');
let dragDepth = 0;
window.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; drop.classList.add('on'); });
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('dragleave', () => { if (--dragDepth <= 0) drop.classList.remove('on'); });
window.addEventListener('drop', (e) => {
  e.preventDefault();
  dragDepth = 0;
  drop.classList.remove('on');
  const f = e.dataTransfer.files[0];
  if (f) f.text().then((t) => load(t, f.name));
});

load($('demo-log').textContent, 'synthetic demo');
</script>
</body>
</html>
